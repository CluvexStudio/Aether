name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # macOS + Windows desktop targets, always on the latest runners.
  # macOS uses macos-latest (Apple Silicon); the Intel/x86_64 binary
  # is cross-compiled from that same runner.
  # Windows uses windows-latest for x86_64. The arm64 MSVC target is not
  # built: it has never been verified on a real arm64 Windows machine.
  #
  # Every leg builds the pluggable transports first and ships them in a
  # pt/ folder beside the binary, so tor works out of the box with
  # nothing for anyone to install by hand.
  #
  # Every leg also ships a LICENSES/ folder beside the binary: aether's
  # license, the license files of lyrebird and psiphon-tunnel-core from
  # the sources the scripts build, lyrebird-THIRD-PARTY-NOTICES.txt and
  # psiphon-tunnel-core-THIRD-PARTY-NOTICES.txt, which the scripts write
  # from `go list -deps` for the Go standard library and modules linked
  # into each, and THIRD-PARTY-NOTICES.txt, which third-party-notices.py
  # writes from `cargo metadata` and `cargo tree` for the Rust standard
  # library and the Rust crates linked into aether with the target and
  # features of the build.
  # ------------------------------------------------------------------
  desktop:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            archive: aether-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            archive: aether-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            archive: aether-windows-x86_64.zip
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build pluggable transports
        shell: bash
        run: bash ../pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        shell: bash
        run: bash ../psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build release binary
        run: cargo build --release --features tor --target ${{ matrix.target }}

      - name: Collect licenses
        shell: bash
        run: |
          py=python3
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; fi
          cp ../LICENSE LICENSES/aether-LICENSE.txt
          "$py" ../third-party-notices.py --target ${{ matrix.target }} --features tor --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  aether pt LICENSES

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force pt target/${{ matrix.target }}/release/pt
          Copy-Item -Recurse -Force LICENSES target/${{ matrix.target }}/release/LICENSES
          Compress-Archive -Path target/${{ matrix.target }}/release/aether.exe,target/${{ matrix.target }}/release/pt,target/${{ matrix.target }}/release/LICENSES,run-aether.bat -DestinationPath ${{ matrix.archive }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux targets, built inside the latest Fedora container.
  # x86_64 builds on an x86_64 runner and arm64 on a native arm64
  # runner, both using fedora:latest so binaries link against a fresh
  # Fedora toolchain. Rust is installed via rustup to guarantee the
  # latest stable, as every other job builds with.
  # ------------------------------------------------------------------
  linux:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            archive: aether-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            archive: aether-linux-arm64.tar.gz
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Install system dependencies (Fedora)
        working-directory: /
        run: |
          dnf -y install \
            gcc gcc-c++ make cmake ninja-build golang nasm clang \
            perl perl-FindBin perl-IPC-Cmd \
            curl git tar gzip xz unzip findutils which python3 diffutils

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (latest stable via rustup)
        working-directory: /
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build pluggable transports
        run: bash ../pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        run: bash ../psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build release binary
        run: cargo build --release --features tor --target ${{ matrix.target }}

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/aether-LICENSE.txt
          python3 ../third-party-notices.py --target ${{ matrix.target }} --features tor --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  aether pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32-bit ARM (Raspberry Pi 2/3 class and older ARM boards).
  # Cross-compiled on the latest Ubuntu runner with the gnueabihf
  # toolchain, which ships the glibc hard-float cross compiler that
  # Fedora does not package cleanly. Best-effort, never blocks release.
  # ------------------------------------------------------------------
  linux-armv7:
    name: Build aether-linux-armv7.tar.gz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build pluggable transports
        run: bash ../pt-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build psiphon
        run: bash ../psiphon-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build release binary
        run: cargo build --release --features tor --target armv7-unknown-linux-gnueabihf

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/aether-LICENSE.txt
          python3 ../third-party-notices.py --target armv7-unknown-linux-gnueabihf --features tor --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/armv7-unknown-linux-gnueabihf/release/pt
          cp -R LICENSES target/armv7-unknown-linux-gnueabihf/release/LICENSES
          cd target/armv7-unknown-linux-gnueabihf/release
          tar -czf ../../../aether-linux-armv7.tar.gz aether pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-armv7.tar.gz
          path: aether/aether-linux-armv7.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32-bit ARM musl, fully static (OpenWrt routers and other musl-based
  # Linux systems). Built directly on the runner rather than with
  # `cross`/Docker: this repo isn't a single cargo workspace (aether
  # depends on ../quiche via path deps, and quiche has its own
  # [workspace]), and cross's container only mounts the crate being
  # built, so it can't see the referenced workspace root. Building on
  # the runner avoids that entirely.
  #
  # The musl toolchain comes from AmanoTeam/musl-gcc-cross's GitHub
  # release, not musl.cc, which blocks all requests from GitHub
  # Actions runners. Note the release asset is named by *host*
  # architecture, not target: x86_64-unknown-linux-gnu.tar.xz is the
  # x86_64-hosted toolchain that contains cross-compilers for every
  # target musl-gcc-cross supports, including armv7-musleabihf.
  #
  # boring-sys uses bindgen (backed by clang) to generate BoringSSL
  # bindings. Without BINDGEN_EXTRA_CLANG_ARGS pointing it at the musl
  # sysroot, clang falls back to the host's glibc headers, which don't
  # exist in the same layout musl expects (missing bits/libc-header-start.h).
  #
  # RUST_LIBC_UNSTABLE_MUSL_V1_2_3 tells the libc crate that this is a
  # modern musl (1.2.x, 64-bit time_t on 32-bit targets). Without it,
  # libc assumes the old 32-bit time_t, which doesn't match what
  # bindgen sees in the real (1.2.x) sysroot headers, and boring fails
  # to build with type mismatches on ASN1_TIME_set/X509_VERIFY_PARAM_set_time.
  # ------------------------------------------------------------------
  linux-armv7-musl:
    name: Build aether-linux-armv7-musl.tar.gz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CC_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CXX_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-g++
      AR_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-ar
      BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_musleabihf: --target=armv7-unknown-linux-musleabihf --sysroot=/opt/musl-cross/armv7-unknown-linux-musleabihf
      RUSTFLAGS: --cfg libc_unstable_musl_v1_2_3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl -fsSL https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz -o /tmp/musl-cross.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -C /opt/musl-cross --strip-components=1 -xJf /tmp/musl-cross.tar.xz

      - name: Install kernel uapi headers into the musl sysroots
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz -o /tmp/linux.tar.xz
          mkdir -p /tmp/ksrc && tar -C /tmp/ksrc --strip-components=1 -xf /tmp/linux.tar.xz
          for inc in /opt/musl-cross/*/include; do
            [ -d "$inc" ] || continue
            case "$inc" in
              *aarch64*) karch=arm64 ;;
              *armv7*|*armhf*|*arm-linux*) karch=arm ;;
              *x86_64*) karch=x86 ;;
              *) karch= ;;
            esac
            [ -z "$karch" ] && continue
            rm -rf /tmp/hdr-$karch
            make -s -C /tmp/ksrc ARCH=$karch INSTALL_HDR_PATH=/tmp/hdr-$karch headers_install
            sudo cp -rn /tmp/hdr-$karch/include/. "$inc/"
          done
          echo "=== uapi check ==="; for inc in /opt/musl-cross/*/include; do echo "$inc:"; ls "$inc/linux/random.h" "$inc/asm/types.h" 2>&1 | sed 's/^/    /'; done

      - name: Build pluggable transports
        run: bash ../pt-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build psiphon
        run: bash ../psiphon-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build release binary
        run: cargo build --release --features tor --target armv7-unknown-linux-musleabihf

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/aether-LICENSE.txt
          python3 ../third-party-notices.py --target armv7-unknown-linux-musleabihf --features tor --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/armv7-unknown-linux-musleabihf/release/pt
          cp -R LICENSES target/armv7-unknown-linux-musleabihf/release/LICENSES
          cd target/armv7-unknown-linux-musleabihf/release
          tar -czf ../../../aether-linux-armv7-musl.tar.gz aether pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-armv7-musl.tar.gz
          path: aether/aether-linux-armv7-musl.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 64-bit x86 and arm64 musl, fully static. x86_64 covers OpenWrt on
  # x86_64 routers/boxes and any generic musl-based x86_64 Linux.
  # aarch64 covers OpenWrt on arm64 routers and Raspberry Pi 4/5 running
  # a musl userland. Same toolchain source and same bindgen/libc env
  # var fixes as linux-armv7-musl above, just different target triples.
  # ------------------------------------------------------------------
  linux-musl:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross_prefix: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
            archive: aether-linux-x86_64-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            cross_prefix: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
            archive: aether-linux-aarch64-musl.tar.gz
    env:
      RUST_LIBC_UNSTABLE_MUSL_V1_2_3: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl -fsSL https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz -o /tmp/musl-cross.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -C /opt/musl-cross --strip-components=1 -xJf /tmp/musl-cross.tar.xz

      - name: Install kernel uapi headers into the musl sysroots
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz -o /tmp/linux.tar.xz
          mkdir -p /tmp/ksrc && tar -C /tmp/ksrc --strip-components=1 -xf /tmp/linux.tar.xz
          for inc in /opt/musl-cross/*/include; do
            [ -d "$inc" ] || continue
            case "$inc" in
              *aarch64*) karch=arm64 ;;
              *armv7*|*armhf*|*arm-linux*) karch=arm ;;
              *x86_64*) karch=x86 ;;
              *) karch= ;;
            esac
            [ -z "$karch" ] && continue
            rm -rf /tmp/hdr-$karch
            make -s -C /tmp/ksrc ARCH=$karch INSTALL_HDR_PATH=/tmp/hdr-$karch headers_install
            sudo cp -rn /tmp/hdr-$karch/include/. "$inc/"
          done
          echo "=== uapi check ==="; for inc in /opt/musl-cross/*/include; do echo "$inc:"; ls "$inc/linux/random.h" "$inc/asm/types.h" 2>&1 | sed 's/^/    /'; done

      - name: Set up cross env vars
        run: |
          triple=$(echo "${{ matrix.target }}" | tr '-' '_')
          prefix=/opt/musl-cross/bin/${{ matrix.cross_prefix }}
          echo "CARGO_TARGET_${triple^^}_LINKER=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CC_${triple}=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CXX_${triple}=${prefix}-g++" >> "$GITHUB_ENV"
          echo "AR_${triple}=${prefix}-ar" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_${triple}=--target=${{ matrix.target }} --sysroot=/opt/musl-cross/${{ matrix.cross_prefix }}" >> "$GITHUB_ENV"

      - name: Build pluggable transports
        run: bash ../pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        run: bash ../psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build release binary
        run: cargo build --release --features tor --target ${{ matrix.target }}

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/aether-LICENSE.txt
          python3 ../third-party-notices.py --target ${{ matrix.target }} --features tor --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }} aether pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Android / Termux targets, built with the NDK via cargo-ndk on the
  # latest Ubuntu runner (the NDK cross toolchain, not the host libc,
  # determines the output). The binary is built for Android 10 (API 29)
  # and later, the level PattNG builds aether, hev-socks5-tunnel and
  # libv2ray for.
  #
  # The transports are built as static GOOS=linux binaries rather than
  # GOOS=android: android needs cgo, while a CGO_ENABLED=0 linux ELF
  # runs as-is under Android and Termux.
  # ------------------------------------------------------------------
  android:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            goarch: arm64
            goarm: ""
            archive: aether-android-arm64.tar.gz
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            goarch: arm
            goarm: "7"
            archive: aether-android-armv7.tar.gz
          - abi: x86_64
            target: x86_64-linux-android
            goarch: amd64
            goarm: ""
            archive: aether-android-x86_64.tar.gz
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build pluggable transports
        run: bash ../pt-build.sh linux ${{ matrix.goarch }} "$PWD/pt" "${{ matrix.goarm }}" "$PWD/LICENSES"

      - name: Build psiphon
        run: bash ../psiphon-build.sh linux ${{ matrix.goarch }} "$PWD/pt" "${{ matrix.goarm }}" "$PWD/LICENSES"

      - name: Build release binary
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          under=$(echo "${{ matrix.target }}" | tr '-' '_')
          export "BORING_BSSL_RUST_CPPLIB_${under}=static:-bundle=c++"
          cargo ndk -t ${{ matrix.abi }} --platform 29 build --release --features tor
          bin="target/${{ matrix.target }}/release/aether"
          needed=$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          echo "[android ${{ matrix.abi }}] aether NEEDED: $needed"
          if grep -qx 'libc++_shared.so' <<<"$needed"; then
            echo "ERROR: aether still needs libc++_shared.so (static libc++ link failed)"; exit 1
          fi

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/aether-LICENSE.txt
          python3 ../third-party-notices.py --target ${{ matrix.target }} --features tor --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  aether pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Collect every artifact, generate SHA-256 checksums and publish.
  # Runs even if some build legs failed, so one broken target never
  # blocks shipping the ones that succeeded.
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: [desktop, linux, linux-armv7, linux-armv7-musl, linux-musl, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
          body: |
            Aether v2.4.0

            Aether is a user-space proxy client. It tunnels traffic out of a filtered network and exposes a local SOCKS5 proxy on 127.0.0.1:1819. Point a browser, terminal, or system proxy at that address and your traffic leaves through the tunnel.

            These notes cover the changes since 2.3.0.

            Changes that can break a command written for 2.3.0

            - `--enroll-address` is now `--api-address`, and `AETHER_ENROLL_ADDRESS` is now `AETHER_API_ADDRESS`. A command with `--enroll-address` stops with "unknown option", and `AETHER_ENROLL_ADDRESS` is no longer read, so where it is still set the calls go by the API's own names.
            - `--no-fragment` is gone, since leaving `--fragment` out already means off, and so is `--api-fragment`, which 2.3.0 took but never read: `--fragment` now splits the WARP API calls as well. A command with either stops with "unknown option".
            - `--register gool` now registers what `--gool` runs: the MASQUE identity and the WireGuard identity carried inside it (`<masque config>-gool.toml`). The two WireGuard hops of the classic gool, which it registered in 2.3.0, now take `--register gool-classic`.
            - MASQUE handshakes send `www.cloudflare.com` as their server name by default, instead of `consumer-masque.cloudflareclient.com`, the name the WARP client sends. `--masque-sni consumer-masque.cloudflareclient.com` sends the old name again.
            - With `--psiphon` and `--psiphon-only`, `AETHER_PSIPHON_INTERFACE` and a `ListenInterface` in `--psiphon-config` no longer set where Psiphon listens; give that address with `--psiphon-bind` or `--bind`. They still apply to `--psiphon-reverse`.
            - An `--upstream` (or `AETHER_UPSTREAM`) that aether cannot dial through, such as one with no port, port 0 or a kind it does not speak, now stops it as it starts, with the option named. 2.3.0 logged that the setting was ignored and connected straight out, around the proxy you named.
            - The Android builds need Android 10 (API 29) or later; those of 2.3.0 ran on Android 7 (API 24) and later.

            The WARP API

            - The calls to the WARP API, which register devices, enroll MASQUE keys and enable WARP, go by api.devices.cloudflare.com, the name Cloudflare's own client has called since its version 2026.6.0. An attempt that gets no answer there, or a refusal from another server than the API, such as an error page, goes by api.cloudflareclient.com next, the name 2.3.0 used, and the name the API answers by goes first for the rest of the run.
            - Behind those two names the calls have a third way: the first of them on a Cloudflare edge of its own, 104.24.4.6 and then 104.18.0.6. A network that blocks the API's own addresses, or answers in their place, but lets an edge through no longer keeps aether from getting a key, and once an edge has answered, the later calls of the run go there first.
            - `--api-address` sets where the calls connect, `--api-host` their HTTP host and `--api-sni` the server name of their ClientHello. The server name follows the host, and the address follows the server name unless given. With `--api-address` the calls go to that address alone, by both names; with `--api-host` or `--api-sni` they go by that one name, so `--api-host api.cloudflareclient.com` sends every call by the old name. Cloudflare refuses a call whose server name and host differ, with a 403 that the error message explains.
            - `--fragment` splits the ClientHello of these calls too, on every transport, with the same `--fragment-size` and `--fragment-delay`, for networks that filter the API's name. Without it, MASQUE over HTTP/2 and these calls, the edge among them, send their ClientHello whole. The help and the guides give the HTTP/2 fragment defaults the code uses: off, and pieces of 8-16 bytes.
            - Getting an identity means registering it and then enabling WARP on it, as the WARP app does, and it is saved only when both went through; if enabling fails, the start or the registration fails and nothing is saved. An identity file that is already there is used as it is. 2.3.0 enabled WARP on the MASQUE identity at every start, before the tunnel came up, which held each start for about 10 seconds where the WARP API is filtered and the tunnel is not, or about 110 on a silent drop.
            - A Retry-After from the WARP API no longer delays the error after the last attempt.
            - The Zero Trust sign-in by email sends each of its requests over a connection of its own, as the WARP API calls do.

            MASQUE

            - `--masque-sni <name>` (`AETHER_MASQUE_SNI`) sets the server name in the ClientHello of every MASQUE handshake, over HTTP/3 and HTTP/2: gateway scans and checks, the tunnel, and both hops of MASQUE-in-MASQUE. Only the TLS name changes; the HTTP host stays cloudflareaccess.com. With `--ech` it is the name inside the encrypted ClientHello. A value that is not a domain name stops aether as it starts.
            - Without `--team`, the MASQUE scan over IPv4 tries 297 gateways and no other address: 75 of 162.159.198.0/24 and 222 of 162.159.199.0/24, those of their 256 that completed a TCP handshake on port 443. It tries each of them on every MASQUE port, 443 first, then 500, 1701, 4500, 4443, 8443 and 8095; before, the scan swept the ranges, and only eight known gateways went past port 443. WARP's own gateways, 162.159.198.1 and 162.159.198.2, are not among the 297; `--peer` still names any gateway.
            - Without `--team`, the MASQUE scan over IPv6 tries WARP's own gateway, 2606:4700:103::1, first and on every MASQUE port, and samples 2606:4700:103::/48 alone, as many addresses as it took from each range before. It no longer tries 2606:4700:d0::/48, 2606:4700:d1::/48 or 2606:4700:102::/48, nor the four known gateways in them; `--peer` still names any gateway.
            - With `--team`, both MASQUE scans still try their known gateways and then every range, 162.159.197.0/24 and 2606:4700:102::/48 first. They now also try 162.159.199.0/24 and 2606:4700:103::/48, and the gateways 162.159.199.2, 162.159.197.2 and 2606:4700:103::1.

            Reconnects

            - A MASQUE gateway whose tunnel keeps ending, as when `--exit-loc` refuses its exit, is left after two tunnels in a row that each ended within five minutes, rested for five minutes and replaced by a scan, as WireGuard endpoints already were. This holds for gool's gateway too; a gateway named with `--peer` stays.
            - Only tunnels that end within five minutes count towards leaving a gateway, endpoint or hop, for MASQUE, WireGuard, the classic gool and MASQUE-in-MASQUE. A tunnel that carried traffic for hours and saw two network changes reconnects at once to the same gateway, endpoint or hops, where 2.3.0 rested the WireGuard endpoint, or dropped the hops of the classic gool and MASQUE-in-MASQUE, and scanned.

            Gool

            - `--register gool` makes gool's WireGuard key directly. Where the key was registered does not set the exit: that comes from where the WireGuard hop is dialled, inside WARP.
            - `--register gool-classic` (also `wiw` and `warp-in-warp`) registers both WireGuard hops of the classic gool, and `--register all` registers all five identities.
            - `--tor-reverse` and `--psiphon-reverse` carry gool over MASQUE. They refuse only WireGuard and the classic gool, which need UDP to reach WARP.
            - When gool registers its WireGuard key from inside its tunnel, it no longer changes `AETHER_UPSTREAM` for the whole process, so nothing else goes into the tunnel meanwhile.

            Ports held from the start

            - Aether binds the ports you dial as it starts and keeps them until it ends: its SOCKS5 proxy (`--bind`) and HTTP proxy (`--http-proxy`), and those of Tor and Psiphon, inside the tunnel and on their own (`--tor-bind`, `--tor-http`, `--psiphon-bind`, `--psiphon-http`). In 2.3.0 most were bound only once the tunnel, Tor or Psiphon was up, and aether's own were let go whenever the tunnel dropped, so while aether connected or reconnected another program could take one and receive what your browser or system proxy sent there. A client that connects before the tunnel is up now waits for it instead of being refused.
            - Psiphon listens on a private loopback port behind the port aether holds for it.
            - When Tor or Psiphon inside the tunnel stops, or a held port breaks, aether ends with its error instead of running on without the proxy you dial. When the tunnel cannot be dialled through Tor or Psiphon around it, aether ends rather than go around them.
            - A listener on port 0 is dialled on the port the system gave it, and one on every address (0.0.0.0 or ::) on the loopback address, which Windows needs, so Tor or Psiphon inside the tunnel, the tunnel through Tor or Psiphon around it, and the look at the exit location all reach it.
            - An error about a port in use names the option that sets that port, such as `--psiphon-bind`, instead of always `--bind`.
            - A proxy that runs short of sockets or buffers for a moment on Windows, or meets a connection that failed while it waited on Linux and Android, tries again instead of stopping.
            - Where a program runs aether through its C library, Tor and Psiphon stop when aether does.

            TLS fingerprint

            - Aether is built on boring 5.3.0, Cloudflare's bindings to BoringSSL, with the BoringSSL of 2026-09-29 and Cloudflare's post-quantum patch. Without the options below every ClientHello is as it was, but for one change of the newer BoringSSL, which Chrome's has as well: a ClientHello of 256 to 511 bytes is no longer padded to 512.
            - `--tls13-ciphers` sets the TLS 1.3 cipher suites, in order, by their standard names; without it they keep Chrome's order. `--tls-key-shares` sets the groups the ClientHello sends key shares for, in order, each one of `--tls-groups`; without it BoringSSL picks them as Chrome does.
            - `--tls-sigalgs` sets the signature algorithms, in order, by BoringSSL's names, and `--enable-grease-sigalgs` puts a GREASE value first among them, as Chrome does.
            - `--tls-cert-compression` offers certificate compression (RFC 8879) with zlib, brotli and zstd, in the order given: `brotli` as Chrome offers it, `zlib:brotli:zstd` as Firefox does.
            - `--tls-alps new` or `--tls-alps old` offers application settings (ALPS) for HTTP/2 and HTTP/3, under the codepoint Chrome sends now (0x44cd) or the one it sent before (0x4469).
            - `--tls-trust-anchors` asks for a certificate from the trust anchors it names, by their IDs in dotted decimal, and `--tls-server-padding` asks the server for padding in its handshake, as Chrome does.
            - `--enable-ech-grease` sends a GREASE ECH extension, which looks like ECH and hides nothing, when there is no ECH config to offer, as Chrome and Firefox do.
            - `--disable-ocsp-stapling`, `--disable-sct` and `--disable-session-ticket` leave out the request for OCSP, the request for signed certificate timestamps and the session ticket, which the handshakes otherwise send as Chrome does. `--disable-extension-permutation` keeps one order of the extensions on every handshake, as Firefox, Python and Go do.
            - All of them shape every TLS handshake the fingerprint shapes: MASQUE over HTTP/2 and over HTTP/3, the WARP API and the DoH lookup of the ECH key. A value BoringSSL does not take stops aether as it starts, with the option named.

            Fixes

            - With `--team`, the TLS of every MASQUE handshake, over HTTP/3 and HTTP/2, is verified by default: the gateway's certificate has to match one of the pinned Cloudflare keys, one more of which joins them. A middlebox that answers with a certificate of its own can no longer stand in for the gateway and see the traffic inside the Zero Trust tunnel. `AETHER_TLS_VERIFY=0` turns the check off; without `--team` it stays off unless `--tls-verify` turns it on.
            - Psiphon dialled through a proxy, as `--psiphon` inside the tunnel is, no longer takes tactics from its servers: they had it attach a BPF program to every TCP dial, which needs root, so without it each dial of the chain failed with "operation not permitted" and the chain took a long way around to come up.

            Builds and docs

            - `aether.exe` no longer needs the Microsoft Visual C++ Redistributable: the C runtime is built into it, so it needs only the DLLs that come with Windows.
            - Every archive has a LICENSES folder next to aether, with the licenses of aether (AGPL-3.0), psiphon-tunnel-core and lyrebird, THIRD-PARTY-NOTICES.txt for the Rust crates and the Rust standard library linked into aether, and a notice each for the Go modules and the Go standard library linked into psiphon-tunnel-core and lyrebird.
            - Every release archive and the Docker image build with the latest stable release of Rust, and the crate no longer declares a minimum Rust version (2.3.0 needed 1.98); the README asks for the latest stable release to build from source.
            - The READMEs, docs and guides, in English and Persian, describe gool, WireGuard inside MASQUE, and the classic gool on `--gool-classic`. Two new guides: Docs/OPENWRT.en.md, linked from the README, runs aether on an OpenWrt router as a service that starts on boot, and a section of Docs/DOCS.fa.md runs it in Termux inside tmux, so it outlives the terminal, and shares its proxy with other devices on the network through `--bind 0.0.0.0:1819`.

            Every archive ships with a matching .sha256 file, and SHA256SUMS.txt lists them all.

            See README.md and the Docs directory for transport selection, obfuscation profiles, and the full environment-variable reference.

  # ------------------------------------------------------------------
  # Build and push the Docker image to GitHub Container Registry (GHCR)
  # ------------------------------------------------------------------
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    # Only a release pushes the image: a manual run from a branch is a build check
    # and must not move the "latest" tag.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker requires repository names to be strictly lowercase.
      # Since CluvexStudio contains uppercase, we lowercase it here.
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
